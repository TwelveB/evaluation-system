services:
  # 1. Database Service (MariaDB)
  mariadb:
    image: mariadb:10.11 # หรือเปลี่ยนเวอร์ชันตามที่ต้องการ
    container_name: mariadb_db
    environment:
      MYSQL_ROOT_PASSWORD: "1" # รหัสผ่านสำหรับ root
      MYSQL_DATABASE: evaluation # สร้างฐานข้อมูลนี้อัตโนมัติ
      MYSQL_USER: user # (ตัวเลือก) สร้าง user ใหม่
      MYSQL_PASSWORD: "1" # (ตัวเลือก) รหัสผ่านสำหรับ user ใหม่
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # 2. Backend Service (Express API)
  server:
    build: ./server
    container_name: express_server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root # หรือใช้ user ที่สร้างไว้ด้านบน
      DB_PASSWORD: "1"
      DB_NAME: evaluation
    depends_on:
      - mariadb
    develop:
      watch:
        - action: sync
          path: ./server
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./server/package.json

  # 3. Frontend Service (React + Vite)
  client:
    build: ./client
    container_name: react_client
    ports:
      - "5173:5173"
    depends_on:
      - server
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./client/package.json

  # 4. Database Management UI (Adminer)
  adminer:
    image: adminer:latest
    container_name: adminer_ui
    ports:
      - "8080:8080"
    depends_on:
      - mariadb

volumes:
  mariadb_data: