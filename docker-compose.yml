services:
  # 1. Database Service (MariaDB)
  mariadb:
    image: mariadb:lts
    container_name: mariadb_db
    environment:
      MARIADB_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: evaluation
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # 2. Backend Service (Express)
  server:
    build: ./server
    container_name: express_server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_USER: root
      DB_PASSWORD: "1"
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: evaluation
    depends_on:
      - mariadb

  # 3. Frontend Service (React / Vue + Vite)
  client:
    build: ./client
    container_name: react_client
    ports:
      - "5173:5173"
    depends_on:
      - server
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./client/package.json

  # 4. Database Management UI (Adminer)
  adminer:
    image: adminer:latest
    container_name: adminer_ui
    ports:
      - "8080:8080"
    depends_on:
      - mariadb

volumes:
  mariadb_data: